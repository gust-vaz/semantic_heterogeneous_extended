services:
  mongodb:
    # Pinned to match the replica-set compose files. The floating mongo:8.0 tag
    # resolves to a patch release that refuses to start on Linux kernel 6.19+
    # (SERVER-121912); 8.0.12 predates that check.
    image: mongo:8.0.12
    restart: no
    command: mongod --bind_ip_all --wiredTigerCacheSizeGB 0.3
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  runner:
    build: ./docker/runner
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_HOST: mongodb
    volumes:
      - .:/app
    working_dir: /app
    profiles:
      - run

volumes:
  mongodb_data:
